name: Problem report
description: Something doesn't work (install, launch, 3D image, controller, ...)
labels: ["bug"]
body:
  - type: dropdown
    id: store
    attributes:
      label: Store
      options:
        - Steam
        - GOG
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Game version
      description: The number in version.txt in the game folder
    validations:
      required: true
  - type: checkboxes
    id: own-copy
    attributes:
      label: Your copy
      options:
        - label: I installed Rez Infinite 3D onto my own purchased copy, installed by the Steam or GOG client
          required: true
  - type: input
    id: display
    attributes:
      label: Display and format
      description: e.g. LG passive 3D monitor, 1080p, Interlaced_Reversed
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and Windows version
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Logs
      description: Attach REZ\rez3d.log (and REZ\xinput_proxy.log for controller problems)
      render: text
