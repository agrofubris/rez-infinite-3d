; Rez Infinite 3D - stereoscopic 3D for Rez Infinite on 3D displays (no VR headset)
; This file is read as rez3d.ini from the folder containing openvr_api.dll.

; Output format:
;   SBS                    side-by-side (3D TVs / projectors with SBS mode)
;   SBS_Cross              side-by-side, eyes swapped (cross-eye)
;   TAB                    top-and-bottom (over-under)
;   TAB_Cross              top-and-bottom, eyes swapped
;   Interlaced             row-interleaved (passive 3D monitors)
;   Interlaced_Reversed    row-interleaved with swapped eye order
;   Checkerboard           checkerboard 3D displays
;   Mono_Left, Mono_Right  single eye (debug)
Format=SBS

; 0-based display index
Monitor=0

; Borderless fullscreen on the selected monitor (uses the desktop/native mode)
Fullscreen=1
VSync=1

; Windows remembers per-app mutes from the volume mixer. 1 = always start the
; game with its sound on (test runs are muted and this undoes it).
UnmuteOnStart=1

; Stereo depth, same semantics as NVIDIA 3D Vision / geo-11:
;   Separation   0-200 %. On-screen parallax of distant objects, where 100% puts
;                them a real eye distance (65 mm) apart on your screen.
;   Convergence  View depth (meters) that sits on the screen plane. Nearer
;                objects pop out, farther ones go behind. Higher = wider virtual
;                eyes (baseline = sep * conv), so more depth overall. The avatar
;                flies ~19 m ahead, the level stretches hundreds of meters beyond:
;                ~20 puts the avatar on the screen and everything else behind it.
;                Higher values make the avatar pop out (and double if too far).
; Live hotkeys (while the game has focus):
;   Ctrl+F3 / Ctrl+F4  separation down / up
;   Ctrl+F5 / Ctrl+F6  convergence down / up
;   Ctrl+F9 / Ctrl+F10 crosstalk cancellation down / up
;   Ctrl+F7            save current values to this file
;   Ctrl+T             toggle stereo on/off
Separation=100
Convergence=20

; Experimental: separation used while a menu is detected (the game's menus are
; head-locked, so both eyes show the same image shifted). Sparse gameplay with
; only distant geometry can look the same and get flattened, so it is off by
; default. -1 = off.
MenuSeparation=-1

; Physical screen width in mm, used for Separation (0 = read from the monitor's
; EDID). Set it for TVs/projectors that report no or a wrong size.
ScreenWidthMM=0

; Horizontal field of view per eye, in degrees
FovH=90

; Eye render resolution relative to the stereo half-image (0.25 - 2.0).
; Above 1.0 is supersampling: Rez is thin lines on black, so 1.5 visibly
; reduces shimmer. Filtered down by the compositor.
RenderScale=1.5

; Interlaced/checkerboard: each eye only gets every other row, so the eye image
; is low-pass filtered over the rows it stands for (thin lines fade evenly
; instead of vanishing/flickering). 0 = off (sharpest), 0.5 = default, 1 = softest.
InterlaceFilter=0.5

; Crosstalk cancellation for passive/active glasses: fraction of the other eye
; that leaks through (typ. 0.01-0.08). Tune live with Ctrl+F9 / Ctrl+F10 until
; ghost copies of bright lines disappear, then Ctrl+F7 to save.
; CrosstalkLift 0-1: ghosts over pure black can only be removed by lifting black
; by that fraction of the crosstalk (0 = keep true black).
Crosstalk=0
CrosstalkLift=0

; Light lost to the glasses: linear-light gain and midtone gamma (>1 brighter)
Brightness=1.0
Gamma=1.0

; Head look: off (fixed forward view) or mouse
Tracking=off
MouseSensitivity=0.25
InvertY=1

; Reported HMD refresh rate (0 = the monitor's refresh rate)
FPS=0

; Hold the game to the display rate like a VR compositor (0 = run uncapped)
FramePacing=1

; Composite on the GPU via shared textures (0 = CPU readback, slower; used
; automatically if GPU sharing is unavailable)
GpuComposite=1

; Near/far clipping planes
NearZ=0.05
FarZ=10000

; Force a specific DXGI adapter index (-1 = same GPU as the game)
Adapter=-1

; OpenVR event pushed at init: 400 = input focus captured (0 = disabled)
FocusEvent=400

; Debug: log every pose/submit; dump composited frames as BMP
LogFrameCalls=0
DumpFrames=0
DumpAfter=0
DumpEvery=1

; Controller stick: % of tilt the game sees (lower = slower reticle than the
; game's slowest cursor speed) and response curve (>1 = finer aim near centre)
PadStickSpeed=60
PadStickCurve=1.5
